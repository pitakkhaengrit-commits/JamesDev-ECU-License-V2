name: Build Windows EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build License.Client/License.Client.csproj -c Release
      - name: Publish Admin
        run: dotnet publish License.Admin/License.Admin.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/admin
      - name: Publish Client
        run: dotnet publish License.Client/License.Client.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/client
      - name: Create Windows installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if ($iscc) {
            & $iscc.Source "installer/JamesDev.iss"
          } else {
            $exe = Get-ChildItem -Path "${env:ProgramFiles(x86)}" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if (-not $exe) { throw "Inno Setup ISCC.exe not found" }
            & $exe "installer/JamesDev.iss"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: ECU-License-V2-Windows
          path: |
            dist/admin/
            dist/client/
      - uses: actions/upload-artifact@v4
        with:
          name: ECU-License-V2-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
