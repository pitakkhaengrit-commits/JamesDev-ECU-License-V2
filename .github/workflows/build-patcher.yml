name: Build Experimental ECU License Patcher
on:
  push:
    branches: [main]
    paths:
      - 'tools/EcuLicensePatcher/**'
      - '.github/workflows/build-patcher.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build patcher
        run: dotnet publish tools/EcuLicensePatcher/EcuLicensePatcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist/patcher
      - uses: actions/upload-artifact@v4
        with:
          name: ECU-V2-Patcher-Experimental
          path: dist/patcher/
